name: Security checks (development)

on:
  push:
    branches:
      - feature/admin-v2-redesign
    paths:
      - "src/**"
      - "scripts/security/**"
      - "package.json"
      - "package-lock.json"
      - "tsconfig.json"
      - ".github/workflows/security-checks.yml"
  pull_request:
    paths:
      - "src/**"
      - "scripts/security/**"
      - "package.json"
      - "package-lock.json"
      - "tsconfig.json"
      - ".github/workflows/security-checks.yml"

permissions:
  contents: read

concurrency:
  group: development-security-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  dependencies:
    name: Audit dependencies (report)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Use Node 24
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          package-manager-cache: false
      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund
      - name: Production dependency audit (report only)
        shell: bash
        run: |
          set +e
          npm audit --omit=dev --json > npm-audit-production-ci.json
          result=$?
          set -e
          node -e 'const fs=require("node:fs"); const a=JSON.parse(fs.readFileSync("npm-audit-production-ci.json","utf8")); const v=a.metadata?.vulnerabilities || {}; console.log("Production dependency findings:",JSON.stringify(v)); if(a.error)console.log("Audit returned an error:",a.error.code || "unknown");'
          echo "npm audit exit code: ${result} (advisory only; no auto-fixes)"
      - name: Upload audit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dependency-audit-production
          path: npm-audit-production-ci.json
          if-no-files-found: warn
          retention-days: 7

  local-test-guards:
    name: Test API runner isolation guards
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Use Node 24
        uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Check authorization schema readiness without a database
        run: node --test scripts/security/auth-schema-preflight.test.mjs
      - name: Simulate Auth rollback outcomes without database
        run: node --test scripts/security/client-account-rollback.test.mjs
      - name: Verify API authorization order contracts
        run: node --test scripts/security/admin-route-contract.test.mjs
      - name: Verify client-project JSON projection is allowlisted
        run: node --test scripts/security/client-project-projection.test.mjs
      - name: Verify administrative editors use authorized project writes
        run: node --test scripts/security/admin-project-editor-contract.test.mjs
      - name: Verify remote targets are blocked
        run: node --test scripts/security/local-admin-api-guard.test.mjs

  http-negative:
    name: Anonymous HTTP rejection (isolated Next.js)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      NEXT_PUBLIC_SUPABASE_URL: http://127.0.0.1:54321
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-placeholder-no-real-access
      SUPABASE_SERVICE_ROLE_KEY: ci-placeholder-no-real-access
      ROTEVO_LOCAL_APP_URL: http://127.0.0.1:3000/
      ROTEVO_LOCAL_API_TESTS: YES_LOCAL_ONLY
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Use Node 24
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          package-manager-cache: false
      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund
      - name: Start Next.js on loopback only
        shell: bash
        run: |
          npm run dev -- --hostname 127.0.0.1 > /tmp/rotevo-next-test.log 2>&1 &
          echo $! > /tmp/rotevo-next-test.pid
          for i in $(seq 1 60); do
            if curl -fsS --max-time 2 http://127.0.0.1:3000/ > /dev/null; then
              exit 0
            fi
            sleep 2
          done
          tail -n 80 /tmp/rotevo-next-test.log
          exit 1
      - name: Reject unauthenticated HTTP operations
        run: node --test scripts/security/local-admin-api-negative.test.mjs
      - name: Stop isolated server
        if: always()
        run: |
          if test -f /tmp/rotevo-next-test.pid; then
            kill "$(cat /tmp/rotevo-next-test.pid)" || true
          fi

  typecheck:
    name: TypeScript verification
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Use Node 24
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          package-manager-cache: false
      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund
      - name: Verify TypeScript
        run: npx tsc --noEmit
