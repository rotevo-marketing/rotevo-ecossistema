name: UI3 isolated integrated Auth API Storage and Finance lab
on:
  push:
    branches:
      - feat/rotevo-ui2-pilot-20261109
    paths:
      - 'scripts/security/ui3-integrated-local-prepare.mjs'
      - 'scripts/security/ui3-integrated-local-http.mjs'
      - 'scripts/security/ui3-staff-browser-local.mjs'
      - 'scripts/security/ui3-sql-baseline.mjs'
      - 'docs/security/sql/ui3-private-planning-json-grants-PROPOSAL-ONLY.sql'
      - 'src/app/api/presentation/project/route.ts'
      - '.github/workflows/ui3-supabase-local-api-lab.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  local-auth-rest:
    name: Isolated real Auth + HTTP + Storage + financial SQL
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: supabase/setup-cli@v1
        with:
          version: 2.121.0
      - name: Install app dependencies without running application
        run: npm ci --no-audit --no-fund
      - name: Prepare Playwright before Next.js starts
        shell: bash
        run: |
          set -euo pipefail
          npm install --no-save --no-package-lock --ignore-scripts playwright@1.65.0
          npx playwright install --with-deps chromium
      - name: Prepare temporary unlinked Supabase project
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/rotevo-ui3-local"
          cd "$RUNNER_TEMP/rotevo-ui3-local"
          supabase init --yes
          cd "$GITHUB_WORKSPACE"
          node scripts/security/ui3-integrated-local-prepare.mjs "$RUNNER_TEMP/rotevo-ui3-local"
      - name: Start ephemeral Supabase Auth and REST services
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/rotevo-ui3-local"
          supabase start --exclude studio,mailpit,imgproxy,realtime,postgres-meta,edge-runtime,logflare,vector,supavisor
          supabase status -o env > "$RUNNER_TEMP/ui3-local-supabase.env"
      - name: Verify remaining integrated flows with real local services and original HTTP routes
        shell: bash
        run: |
          set -euo pipefail
          set -a
          . "$RUNNER_TEMP/ui3-local-supabase.env"
          set +a
          test "$API_URL" != ""
          case "$API_URL" in
            http://127.0.0.1:*|http://localhost:*) ;;
            *) echo "::error::Not an isolated local Supabase URL"; exit 1;;
          esac
          cd "$GITHUB_WORKSPACE"
          test "$API_URL" = "http://127.0.0.1:54321"
          export NEXT_PUBLIC_SUPABASE_URL="$API_URL"
          export NEXT_PUBLIC_SUPABASE_ANON_KEY="$ANON_KEY"
          export SUPABASE_SERVICE_ROLE_KEY="$SERVICE_ROLE_KEY"
          export ROTEVO_LOCAL_APP_URL="http://127.0.0.1:3000/"
          export ROTEVO_LOCAL_API_TESTS="YES_LOCAL_ONLY"
          export ROTEVO_TEAM_ACCESS_ENFORCEMENT_ENABLED="true"
          export ROTEVO_FINANCE_ENABLED="true"
          unset VERCEL_ENV
          npm run dev -- --webpack --hostname 127.0.0.1 > "$RUNNER_TEMP/ui3-integrated-next.log" 2>&1 &
          next_pid=$!
          trap 'kill "$next_pid" 2>/dev/null || true' EXIT
          ready=0
          for i in $(seq 1 90); do
            if curl -fsS --max-time 2 http://127.0.0.1:3000/ >/dev/null; then ready=1; break; fi
            sleep 2
          done
          if [ "$ready" -ne 1 ]; then
            tail -n 40 "$RUNNER_TEMP/ui3-integrated-next.log"
            exit 1
          fi
          node scripts/security/ui3-integrated-local-http.mjs
          # Only the local synthetic stack is reachable from the browser test.
          node scripts/security/ui3-staff-browser-local.mjs
      - name: Upload synthetic-only staff viewport evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ui3-synthetic-staff-viewport
          path: |
            ${{ runner.temp }}/ui3-synthetic-staff-390.png
            ${{ runner.temp }}/ui3-synthetic-staff-login-error.png
          if-no-files-found: ignore
          retention-days: 5
      - name: Stop isolated local stack
        if: always()
        shell: bash
        run: |
          if [ -d "$RUNNER_TEMP/rotevo-ui3-local/supabase" ]; then
            cd "$RUNNER_TEMP/rotevo-ui3-local"
            supabase stop --no-backup || true
          fi
