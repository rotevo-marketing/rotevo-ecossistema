name: UI3 isolated Supabase Auth and PostgREST lab
on:
  push:
    branches:
      - feat/rotevo-ui2-pilot-20261109
    paths:
      - 'scripts/security/ui3-supabase-local-fixture.sql'
      - 'scripts/security/ui3-supabase-local-api-check.mjs'
      - '.github/workflows/ui3-supabase-local-api-lab.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  local-auth-rest:
    name: Isolated real Auth + RLS + PostgREST
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: Install app dependencies without running application
        run: npm ci --no-audit --no-fund
      - name: Prepare temporary unlinked Supabase project
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/rotevo-ui3-local"
          cd "$RUNNER_TEMP/rotevo-ui3-local"
          supabase init --yes
          mkdir -p supabase/migrations
          cp "$GITHUB_WORKSPACE/scripts/security/ui3-supabase-local-fixture.sql" supabase/migrations/20261109000000_ui3_synthetic_auth_rls.sql
      - name: Start ephemeral Supabase Auth and REST services
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/rotevo-ui3-local"
          supabase start --exclude studio,mailpit,imgproxy,realtime,storage-api,postgres-meta,edge-runtime,logflare,vector,supavisor
          supabase status -o env > "$RUNNER_TEMP/ui3-local-supabase.env"
      - name: Verify synthetic tenant isolation through real user sign-in and REST API
        shell: bash
        run: |
          set -euo pipefail
          set -a
          . "$RUNNER_TEMP/ui3-local-supabase.env"
          set +a
          test "$API_URL" != ""
          case "$API_URL" in
            http://127.0.0.1:*|http://localhost:*) ;;
            *) echo "::error::Not an isolated local Supabase URL"; exit 1;;
          esac
          cd "$GITHUB_WORKSPACE"
          node scripts/security/ui3-supabase-local-api-check.mjs
      - name: Stop isolated local stack
        if: always()
        shell: bash
        run: |
          if [ -d "$RUNNER_TEMP/rotevo-ui3-local/supabase" ]; then
            cd "$RUNNER_TEMP/rotevo-ui3-local"
            supabase stop --no-backup || true
          fi
